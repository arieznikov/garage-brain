name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: garagebrain
          POSTGRES_USER: garagebrain
          POSTGRES_PASSWORD: garagebrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garagebrain -d garagebrain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests with coverage
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14
      - name: Summarize line coverage
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/site/jacoco/jacoco.xml")
          if not report.exists():
              print("JaCoCo XML report not found; skipping summary.")
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counters = {c.attrib["type"]: c for c in root.findall("counter")}
          line = counters.get("LINE")
          if line is None:
              print("No LINE counter in JaCoCo report.")
              raise SystemExit(0)

          missed = int(line.attrib["missed"])
          covered = int(line.attrib["covered"])
          total = missed + covered
          pct = (covered / total * 100) if total else 0.0
          print(f"Line coverage: {pct:.1f}% ({covered}/{total})")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
