spring:
  application:
    name: garage-brain-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:garagebrain}
    username: ${DB_USER:garagebrain}
    password: ${DB_PASSWORD:garagebrain}
  flyway:
    enabled: true

garagebrain:
  data-dir: ${GARAGEBRAIN_DATA_DIR:${user.home}/.garage-brain}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
